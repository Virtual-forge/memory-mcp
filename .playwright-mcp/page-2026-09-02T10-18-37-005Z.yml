- generic [active] [ref=f6e1]: "{\"id\":\"workbench\",\"name\":\"Workbench\",\"db_id\":\"a38f9fab-a1b1-5e68-af63-b2c9f89a7d56\",\"is_factory\":false,\"model\":{\"name\":\"OpenAIChat\",\"model\":\"gpt-5.6-luna\",\"provider\":\"OpenAI\"},\"tools\":{\"tools\":[{\"name\":\"resolve_project\",\"description\":\"Resolve a project name to deterministic candidate identities. Use this before project-documentation import or retrieval. It performs no LLM or embedding work and returns at most three candidates for explicit name lookup. For agent project selection, use list_projects instead so every registered project is available to UserFeedbackTools.\",\"parameters\":{\"properties\":{\"name\":{\"title\":\"Name\",\"type\":\"string\"},\"scope\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Scope\"},\"all_scopes\":{\"default\":true,\"title\":\"All Scopes\",\"type\":\"boolean\"}},\"required\":[\"name\"],\"title\":\"resolve_projectArguments\",\"type\":\"object\"},\"requires_confirmation\":false,\"external_execution\":false},{\"name\":\"fetch\",\"description\":\"Fetch complete memory records for exact UUIDs returned by recall, search_candidates, or remember. Pass the scope when known to prevent cross-scope hydration, or set all_scopes=true when the scope is unknown.\",\"parameters\":{\"properties\":{\"ids\":{\"items\":{\"type\":\"string\"},\"title\":\"Ids\",\"type\":\"array\"},\"scope\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Scope\"},\"all_scopes\":{\"default\":false,\"title\":\"All Scopes\",\"type\":\"boolean\"},\"project_id\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Project Id\"}},\"required\":[\"ids\"],\"title\":\"fetchArguments\",\"type\":\"object\"},\"requires_confirmation\":false,\"external_execution\":false},{\"name\":\"drill_down\",\"description\":\"Return the exact L0 conversation turns supporting an atom or an L2 row. Use source_table='atoms' for a direct atom lookup, or pass an L2 category such as projects, tools, skills, profiles, or users to follow its junction table to the source atoms and then to their turns. Project sections require the confirmed project_id returned by list_projects.\",\"parameters\":{\"properties\":{\"id\":{\"title\":\"Id\",\"type\":\"string\"},\"source_table\":{\"title\":\"Source Table\",\"type\":\"string\"},\"scope\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Scope\"},\"all_scopes\":{\"default\":false,\"title\":\"All Scopes\",\"type\":\"boolean\"},\"project_id\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Project Id\"}},\"required\":[\"id\",\"source_table\"],\"title\":\"drill_downArguments\",\"type\":\"object\"},\"requires_confirmation\":false,\"external_execution\":false},{\"name\":\"update\",\"description\":\"Correct one existing asserted L1 atom by UUID while preserving its ID and provenance links. Only supplied fields change. Use an exact atom_id and the correct scope; category must be fact, preference, decision, or event.\",\"parameters\":{\"properties\":{\"atom_id\":{\"title\":\"Atom Id\",\"type\":\"string\"},\"statement\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Statement\"},\"category\":{\"anyOf\":[{\"enum\":[\"fact\",\"preference\",\"decision\",\"event\"],\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Category\"},\"entity\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Entity\"},\"predicate\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Predicate\"},\"scope\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Scope\"}},\"required\":[\"atom_id\"],\"title\":\"updateArguments\",\"type\":\"object\"},\"requires_confirmation\":false,\"external_execution\":false},{\"name\":\"forget\",\"description\":\"Hide an existing memory from retrieval and remove its Qdrant point while retaining the Postgres audit row. Use only with an exact atom UUID and the correct scope. This is a soft delete, not physical data erasure.\",\"parameters\":{\"properties\":{\"atom_id\":{\"title\":\"Atom Id\",\"type\":\"string\"},\"scope\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"null\"}],\"default\":null,\"title\":\"Scope\"}},\"required\":[\"atom_id\"],\"title\":\"forgetArguments\",\"type\":\"object\"},\"requires_confirmation\":false,\"external_execution\":false},{\"name\":\"list_projects\",\"description\":\"List registered project identities for project selection. With no scope, search all project scopes. The result contains every real project followed by a final selection-only record named Other options. Copy that final record into the first Project ask_user question; it is not a project and must never be passed as a project UUID.\",\"parameters\":{\"type\":\"object\",\"properties\":{},\"required\":[]}},{\"name\":\"ask_user\",\"parameters\":{\"type\":\"object\",\"properties\":{},\"required\":[]},\"requires_confirmation\":false,\"external_execution\":false},{\"name\":\"get_user_input\",\"parameters\":{\"type\":\"object\",\"properties\":{},\"required\":[]},\"requires_confirmation\":false,\"external_execution\":false},{\"name\":\"recall\",\"description\":\"Search general or unscoped durable memory with a hard three-attempt budget per user request. Do not call this for a request that names or implies a specific project, repository, application, or extension; list and confirm the project then use project_recall instead. The first two calls search L2 only; the third and final call searches L1 atoms and L2. The result reports the attempt and whether another recall is allowed. When scope is omitted, this searches all scopes; an explicit scope narrows the search. Do not call recall after it reports exhausted.\",\"parameters\":{\"type\":\"object\",\"properties\":{},\"required\":[]}},{\"name\":\"project_recall\",\"description\":\"Search durable memory for one confirmed project. project_id is the UUID returned by list_projects after the user confirms the project identity; never invent it. This uses the same hard three-attempt budget as recall: the first two calls search project L2 only, and the third and final call searches project atoms and L2. When scope is omitted, search all scopes while still filtering every result by project_id. Do not call this until project identity is confirmed.\",\"parameters\":{\"type\":\"object\",\"properties\":{},\"required\":[]}},{\"name\":\"save_memory\",\"description\":\"Save an explicitly requested memory. Call this only for direct save, remember, store, or note requests.\",\"parameters\":{\"type\":\"object\",\"properties\":{\"category\":{\"type\":\"string\",\"enum\":[\"fact\",\"preference\",\"decision\",\"event\"]},\"scope\":{\"type\":\"string\"},\"entity\":{\"type\":\"string\"},\"predicate\":{\"type\":\"string\"},\"statement\":{\"type\":\"string\"}},\"required\":[\"statement\"]}}]},\"sessions\":{\"session_table\":\"agno_sessions\"},\"system_message\":{\"instructions\":\"\\nYou have access to the MCP memory tool and should use it to recall prior conversations\\nand saved user information.\\n- ROUTING PRIORITY: First classify the latest user request. If it names or implies a\\n specific project, repository, application, or extension, list that project before\\n any generic recall. This includes wording such as \\\"in my project\\\" together with a\\n project hint. Never call recall without project_id first for such a request.\\n- For a project query, call list_projects with no scope unless the user explicitly\\n supplied one. The very next action MUST be ask_user with one structured option for\\n every returned project; do not ask for a project name or confirmation in ordinary\\n prose. For example, \\\"tell me about approval in this project\\\" must list all projects,\\n show them through ask_user, then call project_recall with the UUID mapped from the\\n selected option. The first selector's final Other options option must route to a second\\n ask_user question with exactly Recall memory and Cancel options. Cancel at either feedback\\n step must stop the project lookup without calling project_recall. If no projects are\\n registered, report that instead of guessing. If more than three projects are registered,\\n narrow with an exact scope and retry rather than truncating the options.\\n- Scope is an optional narrowing filter, not something to guess. If the user or runtime\\n explicitly gives you a scope, pass that exact scope. Otherwise recall searches all\\n scopes automatically. For search_candidates, fetch, or drill_down, use\\n all_scopes=true when no reliable scope is known so relevant memories are not hidden\\n by an unknown namespace.\\n- Never invent scope strings. Treat the scope returned with a memory as the exact scope\\n for a later targeted fetch, update, forget, or drill-down operation.\\n- For save_memory, omit scope for the configured user unless the user explicitly says\\n the memory belongs to a shared project or another namespace.\\n- HARD RULE: call save_memory only when the latest user message directly asks you to save\\n something, using language such as \\\"remember this\\\", \\\"save this\\\", \\\"store this\\\", or\\n \\\"note this for later\\\". A statement like \\\"I prefer...\\\", \\\"I decided...\\\", or \\\"I use...\\\"\\n is context for the automatic L0 -> L1 -> L2 pipeline, not permission to call remember.\\n- If save intent is ambiguous, do not call remember. The tool also requires user\\n input so the user can edit the statement before it is stored.\\n- After save_memory succeeds, simply say that the memory has been saved to atoms. Do not\\n mention the confirmation, review, editing, or user-input step.\\n- Do not save information unless the user explicitly asks you to remember it.\\n- Before responding, check memory for previously saved details that are relevant to the\\n current conversation. For a project query, complete project resolution and\\n confirmation above, then use project_recall. Never spend a generic recall attempt\\n before that confirmation. For other requests, call recall normally. Both recall tools\\n share one hard budget of at most three calls per user request: the first call searches\\n L2 only, the second call also searches L2 only, and the third and final call searches\\n L1 atoms together with L2. Use the second call only when the first result is empty or\\n does not address the question, and use the third call only when the second result is\\n still empty or inadequate.\\n- Never call search_candidates as an alternate way to search memory. If recall reports\\n that its budget is exhausted, do not call recall again; answer from the evidence\\n already returned or state that memory does not establish the answer.\\n- Treat recalled records as evidence, not as permission to invent missing details.\\n- If the user explicitly asks for more detail, exact wording, evidence, rationale, or\\n history about a recalled record, call drill_down with that record's exact id and\\n source_table. For an L2 record this follows its links to L0; for an L1 atom it\\n follows its direct provenance. Do not use drill_down to search for unrelated\\n records, and do not call it proactively when a summary answers the question.\\n- For a follow-up that asks for details about an already returned record, use drill_down\\n directly rather than spending a new recall attempt.\\n- For project documentation, do not use generic recall, search_candidates, fetch, or\\n drill_down without the confirmed project_id after a real project is selected. Use\\n project_recall after the structured selection, passing the original user request as\\n the query. The only exception is Other options -> Recall memory: use recall with the\\n original user request as the query and do not call project_recall. The selected\\n project ID is authoritative for project_recall. The Other options branch never selects\\n a project and must use its dedicated Recall memory or Cancel question.\\n- Project confirmation is separate from recall and does not consume a recall attempt.\\n- Use memory to recall earlier facts, preferences, or tasks when the user references them.\\n\"},\"is_component\":false}"