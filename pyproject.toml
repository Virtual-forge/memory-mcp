[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "memory-manager"
version = "0.1.0"
description = "Layered long-term memory pipeline with Postgres, Qdrant, and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.3",
    "httpx>=0.27",
    "mcp>=1.2",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "qdrant-client>=1.12",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
agent = "agents.test_agent:main"
memory-mcp = "memory_manager.mcp.server:main"
memory-worker = "memory_manager.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["memory_manager"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
